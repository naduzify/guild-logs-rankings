<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#061529" />
    <meta name="color-scheme" content="dark" />
    <title>Classic Logs Timewalking</title>
    <meta name="description" content="Guild raid histories from Warcraft Logs, Classic Era to Mists of Pandaria." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Oswald:wght@400;600;700&family=Roboto:wght@400;500;600;700&display=swap" />
  </head>
  <body>
    <main class="wrap chooser">
      <header class="hero">
        <h1>Classic Logs <span class="grad">Timewalking</span><small>Pick a guild.</small></h1>
      </header>
      <nav class="guilds" aria-label="Guilds">
        <a class="scard big guild" href="./nightshift/">
          <span class="ribbonwrap"><span class="ribbon">Coming soon</span></span>
          <img class="gicon" src="./nightshift/guild-icon.png" alt="" />
          <span class="slabel">NightShift</span>
          <span class="ssub">Thunderstrike (EU)</span>
        </a>
        <a class="scard big guild" href="./fable/">
          <img class="gicon" src="./fable/guild-icon.png" alt="" />
          <span class="slabel">Fable</span>
          <span class="ssub">Arugal (AU)</span>
        </a>
      </nav>
    </main>
    <script type="module" src="./src/static.js"></script>
  </body>
</html>
